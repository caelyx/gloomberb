name: Build macOS desktop (unsigned)

# Downstream: runs scripts/build-macos-local.sh to build Gloom.app for
# Apple Silicon from the selected branch, for installing this fork's changes in
# place of the upstream release.
# Manual only (Actions > Build macOS desktop (unsigned) > Run workflow).
#
# The app is ad-hoc signed, not signed with a Developer ID or notarised, and
# has no update feed (GLOOMBERB_DESKTOP_LOCAL in electrobun.config.ts), so it
# never offers upstream's releases. After downloading, clear the quarantine
# flag before first launch:
#   xattr -dr com.apple.quarantine /Applications/Gloom.app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Build Gloom.app
        run: |
          brew install zstd
          scripts/build-macos-local.sh

      - name: Package Gloom.app
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          mkdir -p "$RUNNER_TEMP/app"
          ditto -c -k --keepParent artifacts/local/Gloom.app "$RUNNER_TEMP/app/Gloom-$version-${GITHUB_SHA::7}-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: gloomberb-desktop-macos-arm64-unsigned
          path: ${{ runner.temp }}/app/*.zip
          retention-days: 30
