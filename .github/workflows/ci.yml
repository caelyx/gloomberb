name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Pinned, so a host change breaks the build deliberately rather than on
      # somebody else's merge.
      GLOOMBERB_REVISION: main
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      # Mirrors what Gloomberb does at install time: link the host rather than
      # depending on it, so there is one copy of gloomberb and react and CI
      # typechecks against the module graph that runs in production.
      - name: Link the Gloomberb host
        run: |
          git init "$RUNNER_TEMP/gloomberb"
          git -C "$RUNNER_TEMP/gloomberb" remote add origin https://github.com/gloom-sh/gloomberb.git
          git -C "$RUNNER_TEMP/gloomberb" fetch --depth 1 origin "$GLOOMBERB_REVISION"
          git -C "$RUNNER_TEMP/gloomberb" checkout --detach FETCH_HEAD
          bun install --cwd "$RUNNER_TEMP/gloomberb"
          mkdir -p node_modules
          ln -sfn "$RUNNER_TEMP/gloomberb" node_modules/gloomberb
          ln -sfn "$RUNNER_TEMP/gloomberb/node_modules/react" node_modules/react
          ln -sfn "$RUNNER_TEMP/gloomberb/node_modules/@types" node_modules/@types

      - run: bun install
      - run: bun run typecheck
      - run: bun test
