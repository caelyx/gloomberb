[test]
# test-env.ts sets NODE_ENV and turns telemetry off; preload.ts resets process-wide test state before every test; telemetry-guard.ts fails a test whose telemetry request reaches the real fetch. See each file for what and why.
preload = ["./src/test-support/test-env.ts", "./src/test-support/preload.ts", "./src/test-support/telemetry-guard.ts"]
# Downstream: vendored plugins (scripts/vendor-plugin.sh) keep their own tests,
# which run in their own repositories against their own setup.
pathIgnorePatterns = ["vendor/**"]
